# Autostart apps when Hyprland launches
exec-once = waybar &
exec-once = mako &
exec-once = nm-applet &
exec-once = blueman-applet &
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,pkcs11,ssh &
exec-once = brave --password-store=gnome &
exec-once = copyq &
exec-once = hyprctl reload &
exec-once = hyprpaper &
exec-once = kdeconnectd &
exec-once = kdeconnect-indicator  # Optional GUI tray icon &
exec-once = /usr/lib/ibus/ibus-ui-gtk3 --enable-wayland-im --exec-daemon --daemon-args "--xim --panel disable" &
exec-once = wal -R &
exec-once = ~/.config/hypr/pywal-startup.sh &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = xdg-desktop-portal-hyprland &


#everything theme
exec-once = ~/.local/bin/theme-everything.sh


#hyprlock when boot
exec-once = hyprlock --config ~/.config/hyprlock/hyprlock.conf


# Source a file (multi-file configs)
source = ~/.config/hypr/binds.conf



# Other configs above...


general {
    gaps_in = 10
    gaps_out = 15
    border_size = 3
    col.active_border =  rgba(345d38ff)
    col.inactive_border = rgba(313244aa) # faded gray border
    resize_on_border = true
    layout = master
    # Performance tuning
    extend_border_grab_area = 15
}

decoration {
    rounding = 20  # smooth rounded corners
}

animations {
    enabled = yes
    bezier = fastsmooth, 0.4, 0.0, 0.2, 1  # fast but has a slight curve

    animation = windows, 1, 3, fastsmooth
    animation = fade, 1, 2, fastsmooth
    animation = workspaces, 1, 3, fastsmooth
    animation = border, 1, 2, fastsmooth
    animation = fadeDim, 1, 2, fastsmooth
}


dwindle {
    preserve_split = yes
    smart_split = yes
    smart_resizing = yes
}

misc {
    focus_on_activate = true
    mouse_move_enables_dpms = true
    vfr = true  # reduces tearing
    disable_hyprland_logo = true
    animate_manual_resizes = true
}


gestures {
    workspace_swipe = on
}



#scalling

monitor=eDP-1,preferred,0x0,1





# Reverse scroll (natural scrolling)

device {

name = syna2ba6:00-06cb:ce2d-mouse

natural_scroll = true

}

device {

name = syna2ba6:00-06cb:ce2d-touchpad

natural_scroll = true

}


windowrulev2 = opacity 0.6 0.6, class:^(Alacritty)$
