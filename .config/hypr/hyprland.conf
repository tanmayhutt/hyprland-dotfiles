#hdmi



#qt apps
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORM,wayland;xcb

#for gtk apps
env = GTK_THEME,Materia-dark
env = XCURSOR_THEME,Papirus-Dark



# Launch gnome-keyring with all required components
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,ssh,gpg,pkcs11

# Export SSH_AUTH_SOCK so other apps can find it
exec-once = export $(/usr/bin/gnome-keyring-daemon --start --components=secrets,ssh,gpg,pkcs11)

# Use gnome keyring for Brave browser password manager
exec-once = brave --password-store=gnome &




# Autostart apps when Hyprland launches
exec-once = waybar &
exec-once = mako &
exec-once = nm-applet &
exec-once = blueman-applet &
#exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,pkcs11,ssh &
exec-once = copyq &
exec-once = hyprpaper &
exec-once = kdeconnectd &
exec-once = kdeconnect-indicator  # Optional GUI tray icon &
exec-once = /usr/lib/ibus/ibus-ui-gtk3 --enable-wayland-im --exec-daemon --daemon-args "--xim --panel disable" &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = xdg-desktop-portal-hyprland &
exec-once = fcitx5 &


#hyprlock when boot
exec-once = hyprlock --config ~/.config/hyprlock/hyprlock.conf


# Source a file (multi-file configs)
source = ~/.config/hypr/binds.conf




# Input configuration
input {
    kb_layout = us
    kb_options = 
    follow_mouse = 1
    
    # Touchpad settings
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        drag_lock = true
        tap-and-drag = true
    }
}



general {
    gaps_in = 10
    gaps_out = 15
    border_size = 0
    col.active_border = rgba(00000000)
    col.inactive_border = rgba(00000000)
    resize_on_border = false
    extend_border_grab_area = 0
    layout = master
}

decoration {
    rounding = 20  # smooth rounded corners
}

animations {
    enabled = yes
    bezier = fastsmooth, 0.4, 0.0, 0.2, 1  # fast but has a slight curve

    animation = windows, 1, 3, fastsmooth
    animation = fade, 1, 2, fastsmooth
    animation = workspaces, 1, 3, fastsmooth
    animation = border, 1, 2, fastsmooth
    animation = fadeDim, 1, 2, fastsmooth
}


dwindle {
    preserve_split = yes
    smart_split = yes
    smart_resizing = yes
}

misc {
    focus_on_activate = true
    mouse_move_enables_dpms = true
    vfr = true  # reduces tearing
    disable_hyprland_logo = true
    animate_manual_resizes = true
}


gestures {
    workspace_swipe = on
}



#scalling

monitor=eDP-1,preferred,0x0,1





# Reverse scroll (natural scrolling)

device {

name = syna2ba6:00-06cb:ce2d-mouse

natural_scroll = true

}

device {

name = syna2ba6:00-06cb:ce2d-touchpad

natural_scroll = true

}

#cava visualizer

exec-once = kitty --class cava,cava --title cava -e cava


windowrulev2 = float,title:^cava$
windowrulev2 = nofocus,title:^cava$
windowrulev2 = noanim,title:^cava$
windowrulev2 = noinitialfocus,title:^cava$
windowrulev2 = noblur,title:^cava$
windowrulev2 = opacity 0.3,title:^cava$
windowrulev2 = pin,title:^cava$
windowrulev2 = move 0% 90%,title:^cava$
windowrulev2 = size 100% 10%,title:^cava$





#wf-recorder

windowrulev2 = float,class:^(wfrec_timer)$
windowrulev2 = stayfocused,class:^(wfrec_timer)$
windowrulev2 = pin,class:^(wfrec_timer)$
windowrulev2 = noanim,class:^(wfrec_timer)$
windowrulev2 = noblur,class:^(wfrec_timer)$
windowrulev2 = opacity 0.8,class:^(wfrec_timer)$
windowrulev2 = nofocus,class:^(wfrec_timer)$
windowrulev2 = noinitialfocus,class:^(wfrec_timer)$

